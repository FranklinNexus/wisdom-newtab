<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Wisdom New Tab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-right">
          <button class="tool-button" id="settings-open" type="button" aria-label="Open settings" title="Settings">
            <svg aria-hidden="true"><use href="assets/icons.svg#settings"></use></svg>
          </button>
        </div>
      </header>

      <main class="home-stage" id="home-stage">
        <section class="command-center" aria-label="Search and shortcuts">
          <form class="search-bar" id="search-form" role="search">
            <svg class="search-icon" aria-hidden="true"><use href="assets/icons.svg#search"></use></svg>
            <label class="sr-only" for="search-input">Search Google</label>
            <input id="search-input" type="search" autocomplete="off" placeholder="Search Google" autofocus />
            <button class="search-button" type="submit" aria-label="Search">
              <svg aria-hidden="true"><use href="assets/icons.svg#arrow-up-right"></use></svg>
            </button>
          </form>

          <div class="shortcut-grid" id="shortcut-grid" aria-label="Shortcuts"></div>
          <p class="sr-only" id="shortcut-status" aria-live="polite"></p>
        </section>

        <aside class="widget-sidebar" id="widget-sidebar" aria-label="Widgets">
          <header class="widget-sidebar-header">
            <nav class="widget-tabs" aria-label="Choose widget" role="tablist">
              <button class="widget-tab is-active" id="widget-tab-github" data-widget-tab="github" type="button" role="tab" aria-selected="true" aria-controls="widget-pane-github" aria-label="GitHub trends" title="GitHub trends">
                <svg aria-hidden="true"><use href="assets/icons.svg#github"></use></svg>
              </button>
              <button class="widget-tab" id="widget-tab-hackernews" data-widget-tab="hackernews" type="button" role="tab" aria-selected="false" aria-controls="widget-pane-hackernews" aria-label="Hacker News" title="Hacker News">
                <svg aria-hidden="true"><use href="assets/icons.svg#newspaper"></use></svg>
              </button>
              <button class="widget-tab" id="widget-tab-focus" data-widget-tab="focus" type="button" role="tab" aria-selected="false" aria-controls="widget-pane-focus" aria-label="Focus timer" title="Focus timer">
                <svg aria-hidden="true"><use href="assets/icons.svg#timer"></use></svg>
              </button>
            </nav>

            <div class="widget-sidebar-actions">
              <button class="tool-button widget-refresh-button" id="widget-refresh" type="button" aria-label="Refresh widget" title="Refresh widget">
                <svg aria-hidden="true"><use href="assets/icons.svg#refresh"></use></svg>
              </button>
              <button class="tool-button widget-collapse-button" id="widget-collapse" type="button" aria-label="Collapse widgets" title="Collapse widgets">
                <svg aria-hidden="true"><use href="assets/icons.svg#panel-right-close"></use></svg>
              </button>
            </div>
          </header>

          <section class="widget-pane widget-pane-data is-active" id="widget-pane-github" data-widget-pane="github" role="tabpanel" aria-labelledby="widget-tab-github">
            <header class="widget-pane-heading">
              <div>
                <span class="widget-kicker">BUILD / 01</span>
                <h2 id="github-rising-title">Trending on GitHub</h2>
              </div>
            </header>
            <ol class="github-list" id="github-list" aria-live="polite"></ol>
            <footer class="widget-pane-footer">
              <a id="github-search-link" href="https://github.com/search" rel="noreferrer">
                <span id="github-search-label">View all</span>
                <svg aria-hidden="true"><use href="assets/icons.svg#arrow-up-right"></use></svg>
              </a>
            </footer>
          </section>

          <section class="widget-pane widget-pane-data" id="widget-pane-hackernews" data-widget-pane="hackernews" role="tabpanel" aria-labelledby="widget-tab-hackernews" hidden>
            <header class="widget-pane-heading">
              <div>
                <span class="widget-kicker">READ / 02</span>
                <h2 id="hackernews-title">Hacker News</h2>
              </div>
            </header>
            <ol class="hackernews-list" id="hackernews-list" aria-live="polite"></ol>
            <footer class="widget-pane-footer">
              <a id="hackernews-search-link" href="https://news.ycombinator.com/" rel="noreferrer">
                <span id="hackernews-search-label">Open Hacker News</span>
                <svg aria-hidden="true"><use href="assets/icons.svg#arrow-up-right"></use></svg>
              </a>
            </footer>
          </section>

          <section class="widget-pane focus-pane" id="widget-pane-focus" data-widget-pane="focus" role="tabpanel" aria-labelledby="widget-tab-focus" hidden>
            <header class="widget-pane-heading">
              <div>
                <span class="widget-kicker">FOCUS / 03</span>
                <h2 id="focus-title">Focus session</h2>
              </div>
            </header>
            <div class="focus-body">
              <div class="focus-mode-tabs" role="group" aria-label="Focus mode">
                <button class="focus-mode is-active" data-focus-duration="25" type="button">25 min</button>
                <button class="focus-mode" data-focus-duration="5" type="button">5 min</button>
              </div>
              <div class="focus-time" id="focus-time" aria-live="polite">25:00</div>
              <div class="focus-progress" aria-hidden="true"><span id="focus-progress-bar"></span></div>
              <div class="focus-actions">
                <button class="primary-button focus-start-button" id="focus-start" type="button">
                  <svg aria-hidden="true"><use href="assets/icons.svg#play"></use></svg>
                  <span id="focus-start-label">Start</span>
                </button>
                <button class="tool-button focus-reset-button" id="focus-reset" type="button" aria-label="Reset timer" title="Reset timer">
                  <svg aria-hidden="true"><use href="assets/icons.svg#rotate-ccw"></use></svg>
                </button>
              </div>
              <div class="focus-sessions" aria-label="Completed focus sessions">
                <span></span><span></span><span></span><span></span>
              </div>
            </div>
          </section>
        </aside>

        <button class="widget-expand-button" id="widget-expand" type="button" aria-label="Open widgets" title="Open widgets">
          <svg aria-hidden="true"><use href="assets/icons.svg#panel-right-open"></use></svg>
        </button>
      </main>

    </div>

    <dialog class="side-panel side-panel-right" id="settings-dialog" aria-labelledby="settings-title">
      <form class="panel-shell" id="settings-form" method="dialog">
        <header class="panel-header">
          <div>
            <p class="eyebrow">LOCAL CONFIG</p>
            <h2 id="settings-title">settings</h2>
          </div>
          <button class="tool-button" id="settings-close" type="button" aria-label="Close settings" title="Close">
            <svg aria-hidden="true"><use href="assets/icons.svg#x"></use></svg>
          </button>
        </header>

        <div class="panel-scroll settings-scroll">
          <section class="settings-section" aria-labelledby="appearance-title">
            <div class="section-label"><span>01</span><h3 id="appearance-title">appearance</h3></div>

            <fieldset class="choice-fieldset">
              <legend>Surface</legend>
              <div class="segmented-control" id="surface-control">
                <span class="segmented-indicator" aria-hidden="true"></span>
                <label><input type="radio" name="surface" value="light" /><span>Light</span></label>
                <label><input type="radio" name="surface" value="dark" /><span>Dark</span></label>
              </div>
            </fieldset>
          </section>

          <section class="settings-section" id="shortcut-settings" aria-labelledby="shortcuts-title">
            <div class="section-label"><span>02</span><h3 id="shortcuts-title">shortcuts</h3></div>
            <div class="shortcut-editor" id="shortcut-editor"></div>
            <button class="secondary-button" id="shortcut-add" type="button">
              <svg aria-hidden="true"><use href="assets/icons.svg#plus"></use></svg>
              Add shortcut
            </button>
          </section>
        </div>

        <footer class="panel-footer">
          <span>STORED IN THIS BROWSER</span>
          <button class="primary-button" type="submit">
            Save
            <svg aria-hidden="true"><use href="assets/icons.svg#check"></use></svg>
          </button>
        </footer>
      </form>
    </dialog>

    <template id="shortcut-template">
      <div class="shortcut-item">
        <a class="shortcut" rel="noreferrer" draggable="false">
          <span class="shortcut-icon"><img class="shortcut-logo" alt="" draggable="false" hidden /><b></b></span>
          <span class="shortcut-label"></span>
        </a>
        <button class="shortcut-delete" type="button" tabindex="-1" aria-hidden="true">
          <svg aria-hidden="true"><use href="assets/icons.svg#x"></use></svg>
        </button>
      </div>
    </template>

    <template id="github-repo-template">
      <li class="github-repo">
        <a rel="noreferrer">
          <div class="github-repo-top">
            <span class="github-rank"></span>
            <span class="github-language"></span>
            <svg aria-hidden="true"><use href="assets/icons.svg#arrow-up-right"></use></svg>
          </div>
          <h3></h3>
          <p></p>
          <div class="github-stats">
            <span><svg aria-hidden="true"><use href="assets/icons.svg#star"></use></svg><b data-stat="stars"></b></span>
            <span><svg aria-hidden="true"><use href="assets/icons.svg#git-fork"></use></svg><b data-stat="forks"></b></span>
          </div>
        </a>
      </li>
    </template>

    <template id="hackernews-item-template">
      <li class="hackernews-item">
        <a rel="noreferrer">
          <div class="hackernews-item-top">
            <span class="hackernews-rank"></span>
            <span class="hackernews-meta"></span>
            <svg aria-hidden="true"><use href="assets/icons.svg#arrow-up-right"></use></svg>
          </div>
          <h3></h3>
          <p></p>
        </a>
      </li>
    </template>

    <template id="shortcut-editor-template">
      <div class="shortcut-row">
        <label class="compact-field">
          <span>Label</span>
          <input data-field="label" maxlength="28" />
        </label>
        <label class="compact-field url-field">
          <span>URL</span>
          <input data-field="url" type="url" />
        </label>
        <label class="color-field" title="Shortcut color">
          <span class="sr-only">Shortcut color</span>
          <input data-field="color" type="color" />
        </label>
        <button class="tool-button remove-shortcut" type="button" aria-label="Remove shortcut" title="Remove shortcut">
          <svg aria-hidden="true"><use href="assets/icons.svg#trash"></use></svg>
        </button>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
